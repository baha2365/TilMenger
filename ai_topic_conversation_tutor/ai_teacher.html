<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Talk to Emma — TilMenger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── Surface & ground ─────────────────────────────────────────── */
      --bg:            #08080B;
      --bg-soft:       #0C0C11;
      --surface:       rgba(255,255,255,0.045);
      --surface-hover: rgba(255,255,255,0.07);
      --surface-user:  rgba(90,160,255,0.10);
      --border:        rgba(255,255,255,0.085);
      --border-user:   rgba(120,185,255,0.24);

      /* ── Text ──────────────────────────────────────────────────────── */
      --text-1: #F5F5F7;
      --text-2: rgba(245,245,247,0.58);
      --text-3: rgba(245,245,247,0.36);
      --text-4: rgba(245,245,247,0.22);

      /* ── Identity accents ─────────────────────────────────────────── */
      --emma-a: 156,140,255;   /* lavender */
      --emma-b: 110,127,255;   /* indigo */
      --emma-c: 91,79,214;     /* deep violet */
      --user-a: 140,205,255;   /* pale sky */
      --user-b: 74,155,255;    /* azure */
      --user-c: 46,111,224;    /* deep blue */

      /* ── Geometry ──────────────────────────────────────────────────── */
      --radius-lg:   26px;
      --radius-md:   18px;
      --radius-sm:   13px;
      --radius-full: 999px;
      --orb-size:    132px;

      /* ── Motion ────────────────────────────────────────────────────── */
      --ease:      cubic-bezier(0.22, 1, 0.36, 1);
      --dur-fast:  220ms;
      --dur-med:   480ms;
      --dur-slow:  650ms;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", sans-serif;
      background: var(--bg);
      color: var(--text-1);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible {
      outline: 2px solid rgba(156,140,255,0.85);
      outline-offset: 3px;
      border-radius: 6px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    /* ── App shell ─────────────────────────────────────────────────────────── */
    .app {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      isolation: isolate;
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 16%, rgba(var(--emma-a), 0.14), transparent 42%),
        radial-gradient(circle at 12% 85%, rgba(var(--user-b), 0.06), transparent 40%),
        var(--bg);
      transition: background 900ms var(--ease);
    }
    .app[data-orb="user"] .ambient,
    body:has(.orb-stage[data-orb="user"]) .ambient {
      background:
        radial-gradient(circle at 50% 16%, rgba(var(--user-a), 0.13), transparent 42%),
        radial-gradient(circle at 88% 85%, rgba(var(--emma-b), 0.05), transparent 40%),
        var(--bg);
    }

    /* ── Header ────────────────────────────────────────────────────────────── */
    .app-header {
      position: relative;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.75rem;
      padding: 1.1rem 1.4rem 0.9rem;
      background: rgba(8,8,11,0.55);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      border-bottom: 1px solid rgba(255,255,255,0.055);
      flex-shrink: 0;
    }

    .back-link {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-2);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 400;
      white-space: nowrap;
      letter-spacing: 0.005em;
      transition: color var(--dur-fast) var(--ease);
      padding: 0.25rem 0.15rem;
    }
    .back-link:hover { color: var(--text-1); }
    .back-link svg { flex-shrink: 0; }

    .header-topic {
      justify-self: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
      min-width: 0;
      max-width: 260px;
    }
    .topic-title {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      letter-spacing: -0.005em;
    }
    .topic-level {
      font-size: 0.66rem;
      font-weight: 500;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .header-status {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.7rem;
      color: var(--text-3);
      white-space: nowrap;
    }
    .status-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(var(--user-b), 0.9);
      box-shadow: 0 0 7px rgba(var(--user-b), 0.8);
    }

    /* ── Orb stage ─────────────────────────────────────────────────────────── */
    .orb-stage {
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      padding: 1.35rem 1rem 0.9rem;
    }

    .orb-wrap {
      position: relative;
      width: var(--orb-size);
      height: var(--orb-size);
    }

    .orb-stage[data-phase="idle"] .orb-wrap {
      animation: orbFloat 8s ease-in-out infinite alternate;
    }
    @keyframes orbFloat {
      from { transform: translateY(-3px); }
      to   { transform: translateY(4px); }
    }

    .orb-halo {
      position: absolute;
      inset: -38px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--emma-a), 0.32), transparent 68%);
      filter: blur(14px);
      opacity: 0.55;
      animation: haloPulse 6s ease-in-out infinite;
      transition: background 550ms var(--ease), opacity 550ms var(--ease);
      pointer-events: none;
    }
    @keyframes haloPulse {
      0%, 100% { transform: scale(1);    opacity: 0.42; }
      50%      { transform: scale(1.16); opacity: 0.72; }
    }
    .orb-stage[data-orb="user"] .orb-halo {
      background: radial-gradient(circle, rgba(var(--user-b), 0.32), transparent 68%);
    }
    .orb-stage[data-phase="listening"] .orb-halo,
    .orb-stage[data-phase="speaking"] .orb-halo {
      opacity: 0.8;
      animation-duration: 3.4s;
    }
    .orb-stage[data-phase="thinking"] .orb-halo {
      animation-duration: 2.6s;
      opacity: 0.62;
    }
    .orb-stage.is-completed .orb-halo {
      background: radial-gradient(circle, rgba(120,214,170,0.28), transparent 68%);
    }

    /* Core spheres — Emma & User share identical geometry, differ in gradient */
    .orb {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      opacity: 0;
      filter: blur(9px);
      transform: scale(1);
      background-size: 200% 200%;
      transition:
        opacity var(--dur-slow) var(--ease),
        filter var(--dur-slow) var(--ease),
        box-shadow var(--dur-med) var(--ease),
        transform 90ms linear;
      animation: orbDrift 15s ease-in-out infinite;
    }
    @keyframes orbDrift {
      0%, 100% { background-position: 20% 30%; }
      50%      { background-position: 80% 70%; }
    }

    .orb-emma {
      background-image:
        radial-gradient(circle at 30% 24%, rgba(255,255,255,0.55), rgba(255,255,255,0) 42%),
        radial-gradient(circle at 70% 32%, rgba(var(--emma-a), 0.65), transparent 58%),
        radial-gradient(circle at 38% 78%, rgba(var(--emma-b), 0.55), transparent 62%),
        linear-gradient(155deg, rgb(var(--emma-a)) 0%, rgb(var(--emma-b)) 55%, rgb(var(--emma-c)) 100%);
      box-shadow:
        0 0 46px 4px rgba(var(--emma-a), 0.30),
        inset -12px -16px 30px rgba(20,14,48,0.38),
        inset 9px 11px 22px rgba(255,255,255,0.20);
    }
    .orb-user {
      background-image:
        radial-gradient(circle at 32% 26%, rgba(255,255,255,0.55), rgba(255,255,255,0) 42%),
        radial-gradient(circle at 68% 30%, rgba(var(--user-a), 0.62), transparent 58%),
        radial-gradient(circle at 38% 80%, rgba(var(--user-b), 0.5), transparent 62%),
        linear-gradient(155deg, rgb(var(--user-a)) 0%, rgb(var(--user-b)) 55%, rgb(var(--user-c)) 100%);
      box-shadow:
        0 0 46px 4px rgba(var(--user-b), 0.28),
        inset -12px -16px 30px rgba(6,20,44,0.4),
        inset 9px 11px 22px rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .orb-stage[data-orb="emma"] .orb-emma { opacity: 1; filter: blur(0); }
    .orb-stage[data-orb="user"] .orb-user { opacity: 1; filter: blur(0); }

    /* Thinking — slow rotating internal sheen */
    .orb-emma::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent 0%, rgba(255,255,255,0.32) 12%, transparent 26%, transparent 100%);
      opacity: 0;
      transition: opacity var(--dur-med) var(--ease);
      animation: sheenSpin 4.5s linear infinite;
      mix-blend-mode: screen;
    }
    @keyframes sheenSpin { to { transform: rotate(360deg); } }
    .orb-stage[data-phase="thinking"] .orb-emma::after { opacity: 0.65; }

    /* Listening / speaking amplitude reactivity */
    .orb-stage[data-phase="listening"] .orb-user,
    .orb-stage[data-phase="speaking"] .orb-emma {
      transform: scale(calc(1 + var(--amp, 0) * 0.15));
      box-shadow:
        0 0 calc(46px + var(--amp, 0) * 34px) calc(4px + var(--amp, 0) * 10px) rgba(var(--emma-a), 0.34);
    }
    .orb-stage[data-phase="listening"] .orb-user {
      box-shadow:
        0 0 calc(46px + var(--amp, 0) * 34px) calc(4px + var(--amp, 0) * 10px) rgba(var(--user-b), 0.36);
    }

    .user-icon {
      width: 42%;
      height: 42%;
      color: rgba(255,255,255,0.92);
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.25));
    }

    .stage-status {
      font-size: 0.8rem;
      font-weight: 400;
      color: var(--text-3);
      text-align: center;
      letter-spacing: 0.005em;
      transition: color var(--dur-fast) var(--ease);
      min-height: 1.15em;
    }
    .stage-status.listening { color: rgba(var(--user-a), 0.95); }
    .stage-status.thinking  { color: rgba(var(--emma-a), 0.95); }
    .stage-status.speaking  { color: rgba(var(--emma-a), 0.95); }

    /* ── Transcript ────────────────────────────────────────────────────────── */
    .chat-area {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 0.4rem 1.4rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
      scroll-behavior: smooth;
    }
    .chat-area::-webkit-scrollbar { width: 3px; }
    .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.09); border-radius: 2px; }

    .chat-empty {
      margin: auto 0;
      text-align: center;
      color: var(--text-3);
      font-size: 0.82rem;
      line-height: 1.6;
      padding: 0 1rem;
    }

    #messages { display: flex; flex-direction: column; gap: 1.15rem; max-width: 640px; width: 100%; margin: 0 auto; }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: msgIn 0.4s var(--ease) both;
    }
    @keyframes msgIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.teacher { align-self: flex-start; align-items: flex-start; }
    .message.user    { align-self: flex-end;   align-items: flex-end; }

    .msg-label {
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-4);
      margin-bottom: 0.4rem;
      padding: 0 0.2rem;
    }

    .msg-bubble {
      padding: 0.85rem 1.1rem;
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      line-height: 1.7;
      word-break: break-word;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .message.teacher .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top-left-radius: 5px;
      color: var(--text-1);
    }
    .message.user .msg-bubble {
      background: var(--surface-user);
      border: 1px solid var(--border-user);
      border-bottom-right-radius: 5px;
      color: var(--text-1);
    }

    .msg-meta {
      font-size: 0.64rem;
      color: var(--text-4);
      margin-top: 0.35rem;
      padding: 0 0.2rem;
    }

    /* Typing indicator */
    .typing {
      display: none;
      align-self: flex-start;
      align-items: center;
      gap: 0.55rem;
      padding: 0.75rem 1.05rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      border-top-left-radius: 5px;
      max-width: 640px;
      width: fit-content;
      margin: 0 auto;
      align-self: center;
      justify-self: flex-start;
      animation: msgIn 0.3s var(--ease) both;
    }
    .typing.visible { display: flex; }
    .typing-dots { display: flex; gap: 4px; align-items: center; }
    .typing-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: rgba(var(--emma-a), 0.85);
      animation: dotBounce 1.3s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.18s; }
    .typing-dot:nth-child(3) { animation-delay: 0.36s; }
    @keyframes dotBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
      30%           { transform: translateY(-4px); opacity: 1; }
    }
    .typing-label { font-size: 0.74rem; color: var(--text-3); }

    /* ── Turn progress ─────────────────────────────────────────────────────── */
    .turn-tracker {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      padding: 0 1.4rem;
      margin: 0 auto 0.7rem;
      width: 100%;
      max-width: 260px;
    }
    .turn-label {
      font-size: 0.68rem;
      color: var(--text-3);
      letter-spacing: 0.03em;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .turn-track {
      width: 100%;
      height: 2.5px;
      background: rgba(255,255,255,0.08);
      border-radius: var(--radius-full);
      overflow: hidden;
    }
    .turn-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, rgb(var(--emma-b)), rgb(var(--emma-a)));
      border-radius: var(--radius-full);
      transition: width 0.45s var(--ease);
    }

    /* ── Completion banner ─────────────────────────────────────────────────── */
    .completion-banner {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      flex-wrap: wrap;
      background: rgba(120,214,170,0.07);
      border: 1px solid rgba(120,214,170,0.22);
      backdrop-filter: blur(16px);
      color: var(--text-1);
      padding: 0.75rem 1.1rem;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      margin: 0 1.4rem 0.85rem;
      text-align: center;
    }
    .btn-new-topic {
      color: rgba(156,140,255,0.95);
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
      transition: color var(--dur-fast) var(--ease);
    }
    .btn-new-topic:hover { color: rgb(200,190,255); }

    /* ── Control bar ───────────────────────────────────────────────────────── */
    .control-bar {
      position: relative;
      z-index: 1;
      flex-shrink: 0;
      background: linear-gradient(to top, rgba(8,8,11,0.9), rgba(8,8,11,0.55) 70%, transparent);
      padding: 0.6rem 0 max(1.15rem, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.55rem;
    }

    .input-row {
      display: grid;
      grid-template-columns: 46px 1fr 46px;
      align-items: center;
      width: 100%;
      max-width: 460px;
      gap: 0.6rem;
      padding: 0 1.4rem;
    }

    .side-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(14px);
      color: var(--text-2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), opacity var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
    }
    .side-btn:hover:not(:disabled) { background: var(--surface-hover); color: var(--text-1); }
    .side-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .side-spacer { width: 44px; height: 44px; }

    .center-slot { display: flex; justify-content: center; width: 100%; }
    .voice-controls { display: flex; justify-content: center; }

    /* Mic button */
    .mic-btn {
      width: 60px; height: 60px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(16px);
      color: var(--text-1);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--dur-fast) var(--ease), transform 0.12s var(--ease), border-color var(--dur-fast) var(--ease);
      position: relative;
    }
    .mic-btn svg { pointer-events: none; position: relative; z-index: 1; }
    .mic-btn:hover:not(:disabled) { background: var(--surface-hover); transform: scale(1.04); }
    .mic-btn:active:not(:disabled) { transform: scale(0.96); }
    .mic-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .mic-btn.recording {
      background: rgba(var(--user-b), 0.16);
      border-color: rgba(var(--user-a), 0.5);
      color: rgb(200, 226, 255);
    }
    .mic-btn.recording::before,
    .mic-btn.recording::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(var(--user-a), 0.55);
      animation: micPulse 2s ease-out infinite;
    }
    .mic-btn.recording::after { animation-delay: 0.7s; }
    @keyframes micPulse {
      0%   { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.85); opacity: 0; }
    }

    /* Text mode — floating glass pill */
    .text-controls {
      display: none;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      background: var(--surface);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 0.3rem 0.3rem 0.3rem 1.15rem;
      transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
    }
    .text-controls:focus-within {
      border-color: rgba(var(--user-a), 0.45);
      background: rgba(255,255,255,0.06);
    }

    #textInput {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-1);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.6rem 0;
    }
    #textInput::placeholder { color: var(--text-3); }
    #textInput:disabled { opacity: 0.5; }

    .send-btn {
      flex-shrink: 0;
      width: 38px; height: 38px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, rgb(var(--user-a)), rgb(var(--user-c)));
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: opacity var(--dur-fast) var(--ease), transform 0.12s var(--ease);
    }
    .send-btn:hover:not(:disabled) { transform: scale(1.06); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .mic-hint {
      font-size: 0.7rem;
      color: var(--text-4);
      text-align: center;
      min-height: 1em;
    }

    /* ── Loading overlay ───────────────────────────────────────────────────── */
    .loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      z-index: 200;
      transition: opacity 0.5s var(--ease);
    }
    .loader.gone { opacity: 0; pointer-events: none; }

    .loader-orb {
      width: 46px; height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.5), transparent 42%),
                  linear-gradient(155deg, rgb(var(--emma-a)), rgb(var(--emma-c)));
      box-shadow: 0 0 30px rgba(var(--emma-a), 0.4);
      animation: loaderPulse 1.6s ease-in-out infinite;
    }
    @keyframes loaderPulse {
      0%, 100% { transform: scale(1);    opacity: 0.85; }
      50%      { transform: scale(1.12); opacity: 1; }
    }
    .loader-label { font-size: 0.8rem; color: var(--text-3); }

    /* ── Toast ─────────────────────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 132px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(20,19,26,0.85);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      color: var(--text-1);
      padding: 0.7rem 1.15rem;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
      pointer-events: none;
      z-index: 100;
      max-width: min(90vw, 360px);
      text-align: center;
      line-height: 1.45;
    }
    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Responsive ────────────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      :root { --orb-size: 104px; }
      .app-header { padding: 0.9rem 1rem 0.75rem; }
      .chat-area { padding: 0.3rem 1rem 0.6rem; }
      .control-bar { padding: 0.5rem 0 max(1rem, env(safe-area-inset-bottom)); }
      .input-row { padding: 0 1rem; }
      .turn-tracker { padding: 0 1rem; }
      .completion-banner { margin: 0 1rem 0.7rem; flex-direction: column; gap: 0.5rem; }
      .message { max-width: 90%; }
      .orb-stage { padding: 1rem 1rem 0.7rem; gap: 0.7rem; }
      .header-status span:not(.status-dot) { display: none; }
      .header-topic { max-width: 150px; }
    }
  </style>
</head>
<body>

<!-- Loading overlay -->
<div class="loader" id="loader">
  <div class="loader-orb"></div>
  <div class="loader-label" id="loaderLabel">Connecting to Emma…</div>
</div>

<!-- Toast notifications -->
<div class="toast" id="toast"></div>

<div class="app">
  <div class="ambient" aria-hidden="true"></div>

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <header class="app-header">
    <a href="conversation_select.html" class="back-link">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
      Conversation
    </a>

    <div class="header-topic">
      <span class="topic-title" id="topicPill">Topic</span>
      <span class="topic-level" id="levelBadge">—</span>
    </div>

    <div class="header-status">
      <div class="status-dot"></div>
      <span>Online</span>
    </div>
  </header>

  <!-- ── Orb: Emma / User shared presence ───────────────────────────────── -->
  <section class="orb-stage" id="stage" data-orb="emma" data-phase="idle">
    <div class="orb-wrap">
      <div class="orb-halo" aria-hidden="true"></div>
      <div class="orb orb-emma" id="orbEmma" aria-hidden="true"></div>
      <div class="orb orb-user" id="orbUser" aria-hidden="true">
        <svg class="user-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <circle cx="32" cy="23" r="10.5" fill="currentColor"/>
          <path d="M13 53c0-11.5 8.5-19 19-19s19 7.5 19 19" fill="currentColor"/>
        </svg>
      </div>
    </div>
    <p class="stage-status" id="statusText">Tap the mic to speak</p>
  </section>

  <!-- ── Transcript ──────────────────────────────────────────────────────── -->
  <main class="chat-area" id="chatArea">
    <div id="messages"></div>

    <div class="typing" id="typingEl">
      <div class="typing-dots">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
      <span class="typing-label">Emma is thinking…</span>
    </div>
  </main>

  <!-- ── Controls ─────────────────────────────────────────────────────────── -->
  <footer class="control-bar">

    <div class="turn-tracker" id="turnTracker">
      <span class="turn-label" id="turnLabel">0 / 0 turns</span>
      <div class="turn-track">
        <div class="turn-fill" id="turnFill"></div>
      </div>
    </div>

    <div class="completion-banner" id="completionBanner">
      <span>🎉 Topic complete — nice work!</span>
      <a href="conversation_result.html" id="viewResultsLink" class="btn-new-topic">See results →</a>
      <a href="conversation_select.html" class="btn-new-topic">Choose another topic →</a>
    </div>

    <div class="input-row" id="inputRow">

      <button class="side-btn" id="modeToggleBtn" onclick="toggleMode()" title="Type a message" aria-label="Type a message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="12" rx="2.5"/>
          <line x1="6" y1="10" x2="6" y2="10.01"/>
          <line x1="10" y1="10" x2="10" y2="10.01"/>
          <line x1="14" y1="10" x2="14" y2="10.01"/>
          <line x1="18" y1="10" x2="18" y2="10.01"/>
          <line x1="6" y1="14" x2="18" y2="14"/>
        </svg>
      </button>

      <div class="center-slot">
        <div class="voice-controls" id="voiceControls">
          <button class="mic-btn" id="micBtn" onclick="toggleRecord()" title="Click to speak" aria-label="Record voice message">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                 xmlns="http://www.w3.org/2000/svg">
              <rect x="9" y="2" width="6" height="11" rx="3" fill="currentColor"/>
              <path d="M5 10v2a7 7 0 0 0 14 0v-2" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round" fill="none"/>
              <line x1="12" y1="21" x2="12" y2="19" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round"/>
              <line x1="9" y1="23" x2="15" y2="23" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <div class="text-controls" id="textControls">
          <input type="text" id="textInput" placeholder="Message Emma…" autocomplete="off" aria-label="Type a message to Emma" />
          <button class="send-btn" id="sendBtn" onclick="handleSendText()" title="Send" aria-label="Send message">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"/>
              <polyline points="5 12 12 5 19 12"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="side-spacer" aria-hidden="true"></div>
    </div>

    <div class="mic-hint" id="micHint">Tap to speak · Tap again to send</div>
  </footer>

</div><!-- .app -->

<script src="../config.js"></script>
<script>
// ─── Topic context (from the URL — set by conversation_topics_select.html) ──
const params     = new URLSearchParams(location.search);
const topicSlug   = params.get('topic');
const topicTitle  = params.get('title') || 'Conversation';
const topicIcon   = params.get('icon')  || '💬';

if (!topicSlug) {
  // Emma no longer does free-form chat — every session needs a topic.
  window.location.href = 'conversation_select.html';
}

document.title = `Talk about ${topicTitle} — TilMenger`;

// ─── Bootstrap ────────────────────────────────────────────────────────────────
const token = localStorage.getItem('token');
if (!token) { window.location.href = 'index.html'; }

const BASE = (typeof LINGUA !== 'undefined' && LINGUA.aiTeacher)
  ? LINGUA.aiTeacher
  : `${location.origin}/api/ai-teacher`;

// ─── State ────────────────────────────────────────────────────────────────────
// appState: idle | recording | transcribing | thinking | speaking | completed
let appState = 'idle';
// mode: voice | text — which control the center slot shows
let mode     = 'voice';

// Recording
let recorder   = null;
let chunks     = [];
let micStream  = null;
let audioCtx   = null;
let analyser   = null;

// Orb animation (shared driver powers both mic-listening and TTS-speaking reactivity)
let orbRafId        = null;
let ttsCtx          = null;
let ttsInterrupt    = null;
let transcribeTimer = null;

// Playback
let currentAudio = null;

// ─── DOM ─────────────────────────────────────────────────────────────────────
const $  = id => document.getElementById(id);
const chatArea         = $('chatArea');
const messagesEl       = $('messages');
const typingEl         = $('typingEl');
const micBtn           = $('micBtn');
const statusText       = $('statusText');
const stage            = $('stage');
const orbEmma          = $('orbEmma');
const orbUser          = $('orbUser');
const modeToggleBtn    = $('modeToggleBtn');
const voiceControls    = $('voiceControls');
const textControls     = $('textControls');
const textInput        = $('textInput');
const sendBtn          = $('sendBtn');
const loader           = $('loader');
const loaderLbl        = $('loaderLabel');
const levelBadge       = $('levelBadge');
const topicPill        = $('topicPill');
const turnFillEl       = $('turnFill');
const turnLabelEl      = $('turnLabel');
const completionBanner = $('completionBanner');
const viewResultsLink  = $('viewResultsLink');
const toast            = $('toast');
const micHint          = $('micHint');

topicPill.textContent = `${topicIcon} ${topicTitle}`;
viewResultsLink.href =
  `conversation_result.html?topic=${encodeURIComponent(topicSlug)}&title=${encodeURIComponent(topicTitle)}`;

// ─── Toast ────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, ms = 3500) {
  toast.textContent = msg;
  toast.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('visible'), ms);
}

// ─── Turn tracker ─────────────────────────────────────────────────────────────
function updateTurnTracker(used, limit) {
  const pct = limit > 0 ? Math.max(0, Math.min(100, (used / limit) * 100)) : 0;
  turnFillEl.style.width  = `${pct}%`;
  turnLabelEl.textContent = `${used} / ${limit} turns`;
}

// ─── Orb identity/phase ────────────────────────────────────────────────────────
// The single orb component represents whoever currently holds the
// conversational turn. data-orb switches its visual identity (emma/user);
// data-phase drives the state-specific animation within that identity.
function setOrbVisual(orbId, phase) {
  stage.dataset.orb   = orbId;
  stage.dataset.phase = phase;
}

// ─── State machine ────────────────────────────────────────────────────────────
// micDisabled/inputDisabled are independent: while Emma speaks, the mic stays
// tappable (barge-in interrupts her), but text entry is still locked, same as
// every other non-idle state. 'completed' locks everything — the topic's
// turn limit has been reached and the conversation is over.
const STATE_CFG = {
  idle:         { status: 'Tap the mic to speak',                    micDisabled: false, inputDisabled: false, hint: 'Tap to speak · Tap again to send', orbId: 'emma', orbPhase: 'idle' },
  recording:    { status: '● Listening…',                            micDisabled: false, inputDisabled: true,  hint: 'Tap again to stop and send',       orbId: 'user', orbPhase: 'listening' },
  transcribing: { status: 'Processing your voice…',                  micDisabled: true,  inputDisabled: true,  hint: '',                                  orbId: 'user', orbPhase: 'idle' },
  thinking:     { status: 'Emma is thinking…',                       micDisabled: true,  inputDisabled: true,  hint: '',                                  orbId: 'emma', orbPhase: 'thinking' },
  speaking:     { status: 'Emma is speaking — tap mic to interrupt', micDisabled: false, inputDisabled: true,  hint: '',                                  orbId: 'emma', orbPhase: 'speaking' },
  completed:    { status: 'Topic complete',                          micDisabled: true,  inputDisabled: true,  hint: '',                                  orbId: 'emma', orbPhase: 'idle' },
};

function setState(s) {
  appState = s;
  const c = STATE_CFG[s] || STATE_CFG.idle;

  micBtn.classList.toggle('recording', s === 'recording');
  micBtn.disabled = c.micDisabled;

  modeToggleBtn.disabled = c.inputDisabled;
  textInput.disabled     = c.inputDisabled;
  sendBtn.disabled       = c.inputDisabled;

  statusText.className = 'stage-status' + (
    s === 'recording' ? ' listening' :
    (s === 'thinking' || s === 'transcribing') ? ' thinking' :
    s === 'speaking' ? ' speaking' : ''
  );
  statusText.textContent = c.status;
  micHint.textContent    = mode === 'text' && s !== 'completed' ? 'Type your message and press send' : c.hint;

  clearTimeout(transcribeTimer);
  setOrbVisual(c.orbId, c.orbPhase);
  if (s === 'transcribing') {
    // Briefly hold the user orb, then hand the turn back to Emma — a visible
    // beat of "I heard you, now let me think" rather than an instant swap.
    transcribeTimer = setTimeout(() => {
      if (appState === 'transcribing') setOrbVisual('emma', 'thinking');
    }, 380);
  }

  stage.classList.toggle('is-completed', s === 'completed');
  completionBanner.style.display = s === 'completed' ? 'flex' : 'none';
}

// ─── Voice / text mode toggle ─────────────────────────────────────────────────
function toggleMode() {
  if (appState !== 'idle') return;
  mode = mode === 'voice' ? 'text' : 'voice';
  applyMode();
}

function applyMode() {
  const isText = mode === 'text';
  voiceControls.style.display = isText ? 'none' : 'flex';
  textControls.style.display  = isText ? 'flex' : 'none';

  modeToggleBtn.innerHTML = isText
    ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
         <rect x="9" y="2" width="6" height="11" rx="3" fill="currentColor"/>
         <path d="M5 10v2a7 7 0 0 0 14 0v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
         <line x1="12" y1="21" x2="12" y2="19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
         <line x1="9" y1="23" x2="15" y2="23" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
       </svg>`
    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
         <rect x="2" y="6" width="20" height="12" rx="2.5"/>
         <line x1="6" y1="10" x2="6" y2="10.01"/>
         <line x1="10" y1="10" x2="10" y2="10.01"/>
         <line x1="14" y1="10" x2="14" y2="10.01"/>
         <line x1="18" y1="10" x2="18" y2="10.01"/>
         <line x1="6" y1="14" x2="18" y2="14"/>
       </svg>`;
  modeToggleBtn.title = isText ? 'Switch to voice' : 'Type a message';
  modeToggleBtn.setAttribute('aria-label', modeToggleBtn.title);

  micHint.textContent = isText ? 'Type your message and press send' : STATE_CFG[appState].hint;

  // Dropping into text mode with nothing typed yet keeps Emma's orb front and
  // center; the user orb only takes over once they actually start typing.
  if (appState === 'idle') setOrbVisual('emma', 'idle');

  if (isText) { textInput.focus(); }
}

// While typing, the orb hands the turn to the user without waiting for send —
// same principle as the mic: whoever is "talking" owns the orb.
textInput.addEventListener('input', () => {
  if (appState !== 'idle') return;
  setOrbVisual(textInput.value.trim() ? 'user' : 'emma', 'idle');
});
textInput.addEventListener('blur', () => {
  if (appState !== 'idle') return;
  if (!textInput.value.trim()) setOrbVisual('emma', 'idle');
});

// ─── Session init ─────────────────────────────────────────────────────────────
// The ONLY thing the loader waits on is the /session lookup (a fast DB read).
// As soon as that's back, the app is revealed — Emma's opening line (or the
// restored transcript, for a topic already in progress) streams in after.
async function init() {
  try {
    const res = await fetch(
      `${BASE}/session?topic=${encodeURIComponent(topicSlug)}&title=${encodeURIComponent(topicTitle)}`,
      { headers: { Authorization: `Bearer ${token}` } }
    );
    if (res.status === 401) { localStorage.clear(); location.href = 'index.html'; return; }
    if (res.status === 402) { location.href = 'subscribe.html'; return; }

    const data = await res.json();
    if (!data.success) throw new Error(data.message);

    levelBadge.textContent = data.level;
    topicPill.textContent  = `${topicIcon} ${data.topicTitle || topicTitle}`;
    updateTurnTracker(data.turnsUsed, data.turnLimit);

    loader.classList.add('gone');
    setTimeout(() => loader.remove(), 500);

    if (data.history && data.history.length) {
      // Resuming a topic already in progress — restore the transcript
      // without replaying TTS for each past line.
      data.history.forEach(m => addMsg(m.role === 'assistant' ? 'teacher' : 'user', m.content));
      setState(data.completed ? 'completed' : 'idle');
    } else {
      // Brand new topic — Emma opens with a topic-specific greeting.
      loadGreeting();
    }

  } catch (err) {
    console.error('init error:', err);
    loaderLbl.textContent = 'Could not connect. Refresh to retry.';
  }
}

async function loadGreeting() {
  setState('thinking');
  typingEl.classList.add('visible');
  scrollDown();
  try {
    const res = await fetch(`${BASE}/greet`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body:    JSON.stringify({ topic: topicSlug, title: topicTitle }),
    });
    typingEl.classList.remove('visible');

    const data = await res.json();
    if (!data.success) throw new Error(data.message);

    addMsg('teacher', data.reply);
    await playTTS(data.reply);
  } catch (err) {
    console.error('loadGreeting error:', err);
    typingEl.classList.remove('visible');
    setState('idle');
    showToast("Emma couldn't start just now. Tap the mic to begin, or refresh to retry.");
  }
}

// ─── API helpers ──────────────────────────────────────────────────────────────
async function callChat(text) {
  setState('thinking');
  typingEl.classList.add('visible');
  scrollDown();

  const res = await fetch(`${BASE}/chat`, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
    body:    JSON.stringify({ topic: topicSlug, title: topicTitle, text }),
  });

  typingEl.classList.remove('visible');

  const data = await res.json();
  if (!data.success) throw new Error(data.message || 'Chat error');
  return data; // { reply, turnsUsed, turnLimit, completed }
}

async function playTTS(text) {
  setState('speaking');
  try {
    const res = await fetch(`${BASE}/speak`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
      body:    JSON.stringify({ text }),
    });
    if (!res.ok) throw new Error('TTS request failed');

    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);

    currentAudio?.pause();
    currentAudio = new Audio(url);

    // Route playback through an analyser so the orb pulses with Emma's voice.
    // Non-fatal if unsupported — the reply stays fully audible either way.
    try {
      if (!ttsCtx) ttsCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (ttsCtx.state === 'suspended') await ttsCtx.resume();
      const src = ttsCtx.createMediaElementSource(currentAudio);
      const an  = ttsCtx.createAnalyser();
      an.fftSize = 64;
      src.connect(an);
      an.connect(ttsCtx.destination);
      driveOrb(an, () => appState === 'speaking' && currentAudio && !currentAudio.paused && !currentAudio.ended, orbEmma);
    } catch (e) {
      console.warn('Orb audio-reactivity unavailable:', e.message);
    }

    await new Promise((resolve, reject) => {
      ttsInterrupt = () => reject(new Error('interrupted'));
      currentAudio.onended = resolve;
      currentAudio.onerror = reject;
      currentAudio.play().catch(reject);
    });
    URL.revokeObjectURL(url);
  } catch (err) {
    console.warn('TTS playback skipped:', err.message);
    // Non-fatal — the text is still visible in the chat
  }
  ttsInterrupt = null;
  cancelAnimationFrame(orbRafId);
  orbEmma.style.setProperty('--amp', '0');
  if (appState === 'speaking') setState('idle');
}

// ─── Recording ────────────────────────────────────────────────────────────────
async function toggleRecord() {
  if (appState === 'recording') { stopRecord(); return; }

  if (appState === 'speaking') {
    // Barge-in: tapping the mic while Emma talks interrupts her and starts listening.
    currentAudio?.pause();
    ttsInterrupt?.();
    cancelAnimationFrame(orbRafId);
    orbEmma.style.setProperty('--amp', '0');
    setState('idle');
  } else if (appState !== 'idle') {
    return;
  }

  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    showToast(
      err.name === 'NotAllowedError'
        ? 'Microphone access denied. Enable it in your browser settings.'
        : 'Could not access microphone.'
    );
    return;
  }

  // Web Audio analyser drives the orb's real-time reactivity
  audioCtx = new AudioContext();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 128;
  audioCtx.createMediaStreamSource(micStream).connect(analyser);

  chunks = [];

  const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
    ? 'audio/webm;codecs=opus'
    : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';

  recorder = new MediaRecorder(micStream, mime ? { mimeType: mime } : {});
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = onRecordStop;
  recorder.start(100);

  setState('recording');
  driveOrb(analyser, () => appState === 'recording', orbUser);
}

function stopRecord() {
  if (recorder?.state !== 'inactive') recorder.stop();
  micStream?.getTracks().forEach(t => t.stop());
  cancelAnimationFrame(orbRafId);
  orbUser.style.setProperty('--amp', '0');
  audioCtx?.close();
  setState('transcribing');
}

async function onRecordStop() {
  if (!chunks.length) { setState('idle'); showToast('No audio captured. Please try again.'); return; }

  const mime = recorder?.mimeType || 'audio/webm';
  const blob = new Blob(chunks, { type: mime });

  if (blob.size < 800) { setState('idle'); showToast('Recording too short. Hold the mic and speak.'); return; }

  try {
    const ext  = mime.includes('ogg') ? 'ogg' : mime.includes('mp4') ? 'mp4' : 'webm';
    const form = new FormData();
    form.append('audio', blob, `rec.${ext}`);

    const tRes  = await fetch(`${BASE}/transcribe`, {
      method:  'POST',
      headers: { Authorization: `Bearer ${token}` },
      body:    form,
    });
    const tData = await tRes.json();
    if (!tData.success) throw new Error(tData.message);

    const userText = (tData.text || '').trim();
    if (!userText || tData.empty) {
      setState('idle');
      showToast(tData.nonEnglish
        ? "Let's keep it in English! Try that again."
        : "I couldn't hear that clearly. Please try again.");
      return;
    }

    await sendUserMessage(userText);

  } catch (err) {
    console.error('onRecordStop error:', err);
    showToast('Something went wrong. Please try again.');
    setState('idle');
  }
}

// ─── Orb reactivity ────────────────────────────────────────────────────────────
// Shared driver: reads live frequency data from any AnalyserNode (mic input
// while listening, or TTS playback while speaking) and maps volume to the
// target orb's --amp CSS variable each frame, for as long as isActiveFn() is true.
function driveOrb(analyserNode, isActiveFn, targetOrb) {
  const data = new Uint8Array(analyserNode.frequencyBinCount);
  cancelAnimationFrame(orbRafId);

  const step = () => {
    if (!isActiveFn()) { targetOrb.style.setProperty('--amp', '0'); return; }
    orbRafId = requestAnimationFrame(step);
    analyserNode.getByteFrequencyData(data);
    let sum = 0;
    for (let i = 0; i < data.length; i++) sum += data[i];
    const avg = (sum / data.length) / 255;
    targetOrb.style.setProperty('--amp', avg.toFixed(3));
  };
  step();
}

// ─── Sending messages (shared by voice and text) ──────────────────────────────
async function sendUserMessage(text) {
  addMsg('user', text);

  try {
    const data = await callChat(text);
    addMsg('teacher', data.reply);
    updateTurnTracker(data.turnsUsed, data.turnLimit);
    await playTTS(data.reply);

    if (data.completed) {
      showToast("Nice work! You've completed this topic. 🎉", 5000);
      setState('completed');
    }
  } catch (err) {
    console.error('sendUserMessage error:', err);
    showToast('Something went wrong. Please try again.');
    setState('idle');
  }
}

// ─── Text input ────────────────────────────────────────────────────────────────
function handleSendText() {
  if (appState !== 'idle') return;
  const val = textInput.value.trim();
  if (!val) return;
  textInput.value = '';
  sendUserMessage(val);
}

textInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); handleSendText(); }
});

// ─── Message helpers ──────────────────────────────────────────────────────────
function addMsg(role, text) {
  const el   = document.createElement('div');
  el.className = `message ${role}`;
  const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  if (role === 'teacher') {
    el.innerHTML = `
      <div class="msg-label">Emma</div>
      <div class="msg-bubble">${safe(text)}</div>
      <div class="msg-meta">${time}</div>`;
  } else {
    el.innerHTML = `
      <div class="msg-label">You</div>
      <div class="msg-bubble">${safe(text)}</div>
      <div class="msg-meta">${time}</div>`;
  }

  messagesEl.appendChild(el);
  scrollDown();
}

function scrollDown() {
  requestAnimationFrame(() => { chatArea.scrollTop = chatArea.scrollHeight; });
}

function safe(t) {
  return t
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}

// ─── Keyboard shortcut: Space to toggle record ────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  if (document.activeElement?.tagName === 'INPUT') return;
  if (mode !== 'voice') return;
  e.preventDefault();
  toggleRecord();
});

// ─── Go ───────────────────────────────────────────────────────────────────────
applyMode();
init();
</script>
