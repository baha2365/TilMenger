<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Topic — TilMenger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --canvas-blue:#E7F0FA; --canvas-white:#F8FAFC; --canvas-cyan:#E9F7F6; --canvas-violet:#EFEDFB;
    --ink-1:#1D1D1F; --ink-2:#6E6E76; --ink-3:#9C9CA5;
    --glass:rgba(255,255,255,0.58); --glass-strong:rgba(255,255,255,0.80); --glass-soft:rgba(255,255,255,0.38); --glass-border:rgba(255,255,255,0.70);
    --hairline:rgba(28,28,36,0.08); --hairline-2:rgba(28,28,36,0.13);
    --topic:#5E5CE6; --topic-dark:#4340B0; --topic-bg:rgba(94,92,230,0.10); --topic-bd:rgba(94,92,230,0.24); --topic-glow:rgba(94,92,230,0.32);
    --success:#2FB350; --success-bg:rgba(47,179,80,0.10); --success-bd:rgba(47,179,80,0.26);
    --error:#FF3B30; --error-bg:rgba(255,59,48,0.09); --error-bd:rgba(255,59,48,0.24);
    --amber:#FF9F0A; --amber-bg:rgba(255,159,10,0.13); --amber-bd:rgba(255,159,10,0.28);
    --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:11px;
    --sh-1:0 1px 1px rgba(28,28,36,0.03),0 6px 18px rgba(28,28,36,0.05);
    --sh-2:0 2px 6px rgba(28,28,36,0.05),0 14px 34px rgba(28,28,36,0.08);
    --sh-float:0 22px 60px rgba(28,28,36,0.16);
    --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  }
  html{scroll-behavior:smooth;}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--canvas-white);color:var(--ink-1);min-height:100vh;padding-bottom:60px;-webkit-font-smoothing:antialiased;overflow-x:hidden;}

  .bg-blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;background:
    radial-gradient(ellipse 60% 50% at 18% 8%,var(--canvas-blue) 0%,transparent 60%),
    radial-gradient(ellipse 55% 45% at 88% 18%,var(--canvas-violet) 0%,transparent 60%),
    radial-gradient(ellipse 60% 55% at 30% 92%,var(--canvas-cyan) 0%,transparent 62%),
    var(--canvas-white);}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;}
  .blob-1{width:520px;height:420px;top:-160px;left:-120px;background:radial-gradient(circle,rgba(94,92,230,.28),transparent 70%);}
  .blob-2{width:460px;height:460px;top:-80px;right:-140px;background:radial-gradient(circle,rgba(10,132,255,.22),transparent 70%);animation:driftSlow 26s ease-in-out infinite;}
  .blob-3{width:560px;height:460px;bottom:-200px;left:20%;background:radial-gradient(circle,rgba(0,190,190,.18),transparent 70%);animation:driftSlow 32s ease-in-out infinite reverse;}
  @keyframes driftSlow{0%,100%{transform:translate(0,0);}50%{transform:translate(-24px,26px);}}
  @media(prefers-reduced-motion:reduce){.blob-2,.blob-3{animation:none;}}

  nav{background:var(--glass-strong);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border-bottom:1px solid var(--hairline);padding:0 2rem;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .brand{text-decoration:none;display:flex;align-items:center;gap:.55rem;color:var(--ink-1);font-size:1.02rem;font-weight:800;letter-spacing:-.02em;}
  .brand-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--topic),#0A84FF);display:flex;align-items:center;justify-content:center;font-size:.9rem;color:#fff;box-shadow:0 3px 12px var(--topic-glow),inset 0 1px 0 rgba(255,255,255,.3);}
  .brand em{font-style:normal;background:linear-gradient(135deg,var(--topic),#0A84FF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .btn-back{display:inline-flex;align-items:center;gap:.4rem;padding:.42rem 1.05rem;border-radius:999px;font-size:.8rem;font-weight:700;color:var(--ink-2);background:none;border:1px solid var(--hairline-2);cursor:pointer;transition:all .18s var(--ease);}
  .btn-back:hover{border-color:var(--topic);color:var(--ink-1);background:var(--topic-bg);}

  .main{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:2rem 1.2rem 2rem;display:flex;flex-direction:column;gap:1.4rem;}

  .hero{background:linear-gradient(150deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.42) 100%);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--glass-border);border-radius:var(--r-lg);box-shadow:var(--sh-2),inset 0 1px 0 rgba(255,255,255,.55);padding:1.9rem 2.1rem;position:relative;overflow:hidden;}
  .hero::after{content:'';position:absolute;top:-60px;right:-60px;width:260px;height:210px;background:radial-gradient(ellipse at top right,rgba(94,92,230,0.16) 0%,rgba(10,132,255,0.08) 50%,transparent 72%);pointer-events:none;}
  .hero-eyebrow{position:relative;z-index:1;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--topic);margin-bottom:.55rem;}
  .hero-title{position:relative;z-index:1;font-family:'Inter Tight','Inter',sans-serif;font-size:clamp(1.3rem,3vw,1.85rem);font-weight:800;color:var(--ink-1);letter-spacing:-.03em;}
  .hero-desc{position:relative;z-index:1;font-size:.85rem;color:var(--ink-2);margin-top:.65rem;line-height:1.6;}
  .hero-meta{position:relative;z-index:1;font-size:.75rem;color:var(--ink-3);margin-top:.65rem;font-weight:600;}

  .card{background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--glass-border);border-radius:var(--r-lg);box-shadow:var(--sh-2),inset 0 1px 0 rgba(255,255,255,.55);padding:1.7rem;}
  .card-title{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--topic);margin-bottom:1.15rem;display:flex;align-items:center;gap:.55rem;}
  .card-title::before{content:'';width:20px;height:2.5px;background:linear-gradient(90deg,var(--topic),#0A84FF);border-radius:2px;}

  .video-wrap{border-radius:var(--r-md);overflow:hidden;background:#000;box-shadow:var(--sh-1);}
  .video-wrap iframe{width:100%;aspect-ratio:16/9;border:none;display:block;}
  .video-fallback{padding:2.4rem 1.5rem;text-align:center;background:rgba(255,255,255,.5);border-radius:var(--r-md);}
  .video-fallback .vf-icon{font-size:2.4rem;margin-bottom:.8rem;}
  .btn-watch{display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.6rem;background:linear-gradient(135deg,var(--topic),var(--topic-dark));color:#fff;border-radius:999px;text-decoration:none;font-weight:700;font-size:.9rem;margin-top:.8rem;box-shadow:0 4px 18px var(--topic-glow),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .2s var(--ease);}
  .btn-watch:hover{transform:translateY(-2px);}

  .already-banner{display:flex;align-items:center;gap:.8rem;padding:1.05rem 1.25rem;background:var(--amber-bg);border:1px solid var(--amber-bd);border-radius:var(--r-md);font-size:.85rem;color:#8A5A06;box-shadow:var(--sh-1);}

  .progress-label{display:flex;justify-content:space-between;font-size:.72rem;font-weight:700;color:var(--ink-3);margin-bottom:.55rem;}
  .progress-track{height:8px;background:var(--hairline-2);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--topic),#8B5CF6);border-radius:99px;transition:width .45s var(--ease);}

  .question-block{margin-bottom:1.8rem;padding-bottom:1.8rem;border-bottom:1px dashed var(--hairline-2);}
  .question-block:last-of-type{margin-bottom:0;padding-bottom:0;border-bottom:none;}
  .question-header{display:flex;align-items:flex-start;gap:.7rem;margin-bottom:.9rem;}
  .q-num{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;background:linear-gradient(135deg,#FF9F0A,#FFB74A);color:#fff;border-radius:50%;font-size:.8rem;font-weight:800;flex-shrink:0;box-shadow:0 3px 10px rgba(255,159,10,0.35);}
  .question-text{font-size:.95rem;font-weight:700;color:var(--ink-1);line-height:1.4;}

  .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;}
  .option-label{display:flex;align-items:center;gap:.65rem;padding:.72rem .9rem;border-radius:var(--r-sm);border:1px solid var(--glass-border);background:rgba(255,255,255,.5);cursor:pointer;transition:all .18s var(--ease);font-size:.85rem;font-weight:600;color:var(--ink-2);user-select:none;}
  .option-label:hover:not(.locked){border-color:var(--topic);background:var(--topic-bg);color:var(--ink-1);}
  .option-label.selected{border-color:var(--topic);background:var(--topic-bg);color:var(--topic);}
  .option-label.correct{border-color:var(--success-bd);background:var(--success-bg);color:#1F8A3B;}
  .option-label.wrong{border-color:var(--error-bd);background:var(--error-bg);color:#D8291E;}
  .option-label.locked{cursor:default;}
  .opt-letter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;background:var(--topic-bg);color:var(--topic);font-size:.75rem;font-weight:800;flex-shrink:0;}
  .option-label.correct .opt-letter{background:var(--success);color:#fff;}
  .option-label.wrong .opt-letter{background:var(--error);color:#fff;}
  .option-label.selected .opt-letter{background:var(--topic);color:#fff;}

  .feedback-row{display:none;align-items:center;gap:.4rem;margin-top:.75rem;font-size:.78rem;font-weight:700;}
  .feedback-row.show{display:flex;}
  .feedback-row.correct{color:#1F8A3B;}
  .feedback-row.wrong{color:#D8291E;}

  .actions-wrap{display:flex;flex-direction:column;align-items:center;gap:.9rem;margin-top:1.6rem;}
  .btn-check{display:inline-flex;align-items:center;gap:.6rem;padding:.9rem 2.8rem;border-radius:999px;background:linear-gradient(135deg,var(--topic),var(--topic-dark));color:#fff;border:none;font-size:.95rem;font-weight:700;cursor:pointer;box-shadow:0 4px 18px var(--topic-glow),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .2s var(--ease),box-shadow .2s,opacity .2s;}
  .btn-check:hover{transform:translateY(-2px);box-shadow:0 10px 26px var(--topic-glow);}
  .btn-check:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none;}
  .warn-msg{display:none;font-size:.82rem;font-weight:700;color:#D8291E;text-align:center;}
  .warn-msg.show{display:block;}

  .one-attempt-note{font-size:.72rem;color:var(--ink-3);text-align:center;}

  .score-banner{display:none;border-radius:var(--r-lg);padding:1.4rem 1.6rem;text-align:center;font-weight:800;font-size:1rem;box-shadow:var(--sh-1);}
  .score-banner.show{display:block;}
  .score-banner.great{background:var(--success-bg);color:#1F8A3B;border:1px solid var(--success-bd);}
  .score-banner.good{background:var(--amber-bg);color:#8A5A06;border:1px solid var(--amber-bd);}
  .score-banner.tryagain{background:var(--error-bg);color:#D8291E;border:1px solid var(--error-bd);}
  .score-num{font-size:2.2rem;font-weight:800;display:block;margin-bottom:.25rem;}

  .state-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:.9rem;text-align:center;padding:2.5rem 1.2rem;}
  .state-icon{font-size:2.8rem;}
  .state-title{font-size:1.15rem;font-weight:800;color:var(--ink-1);}
  .state-sub{font-size:.85rem;color:var(--ink-3);}

  .sk{display:block;height:16px;border-radius:8px;background:linear-gradient(90deg,rgba(255,255,255,.4) 25%,rgba(255,255,255,.7) 50%,rgba(255,255,255,.4) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;margin-bottom:.7rem;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  @media(max-width:600px){
    .hero{padding:1.5rem 1.5rem;}
    .card{padding:1.25rem;}
    .options-grid{grid-template-columns:1fr;}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
</style>
</head>
<body>

<div class="bg-blobs" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<nav>
  <a class="brand" href="#" onclick="history.back();return false;"><div class="brand-mark">✦</div>Til<em>Menger</em></a>
  <button class="btn-back" onclick="history.back()">← Back</button>
</nav>

<div id="app"></div>

<script src="../../config.js"></script>
<script>
  const API    = LINGUA.base;
  const params = new URLSearchParams(window.location.search);
  const taskId = params.get('id');
  const token  = localStorage.getItem('token');
  const LETTERS = ['A','B','C','D'];

  let taskData    = null;
  let selections  = {};
  let alreadyDone = false;

  (async function boot() {
    if (!token) { renderState('🔒', 'Login Required', 'Please log in to view this topic.', true); return; }
    if (!taskId) { renderState('⚠️', 'No Topic Found', 'No topic ID was provided in the URL.'); return; }
    renderLoading();
    try {
      const res  = await fetch(`${API}/api/topics/${taskId}/play`, { headers: { Authorization: 'Bearer ' + token } });
      const data = await res.json();
      if (!data.success) throw new Error(data.message || 'Topic not found.');
      taskData = data.task;
      if (data.submission) {
        alreadyDone = true;
        renderTask();
        applyReview(data.submission, data.review);
      } else {
        renderTask();
      }
    } catch (e) {
      renderState('📭', 'Topic Not Found', e.message || 'This topic could not be loaded.');
    }
  })();

  function renderLoading() {
    document.getElementById('app').innerHTML =
      '<div class="main"><div class="card"><div class="sk" style="width:40%;height:20px;margin-bottom:18px"></div>' +
      '<div class="sk" style="width:100%;height:220px"></div></div></div>';
  }

  function renderState(icon, title, sub, showLogin) {
    document.getElementById('app').innerHTML =
      '<div class="state-screen"><div class="state-icon">' + icon + '</div>' +
      '<div class="state-title">' + title + '</div><div class="state-sub">' + sub + '</div>' +
      (showLogin ? '<button onclick="window.location.href=\'../../index.html\'" style="margin-top:10px;padding:12px 30px;background:var(--topic);color:#fff;border:none;border-radius:999px;font-family:Inter,sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;">Go to Login</button>' : '') +
      '</div>';
  }

  function getYouTubeEmbed(url) {
    try {
      const u = new URL(url);
      if (u.hostname.replace('www.', '') === 'youtube.com') {
        const v = u.searchParams.get('v');
        if (v) return `https://www.youtube.com/embed/${v}`;
        const parts = u.pathname.split('/').filter(Boolean);
        if ((parts[0] === 'embed' || parts[0] === 'shorts') && parts[1]) return `https://www.youtube.com/embed/${parts[1]}`;
      }
      if (u.hostname === 'youtu.be' && u.pathname.length > 1) return `https://www.youtube.com/embed/${u.pathname.slice(1)}`;
    } catch (_) {}
    return null;
  }

  function renderTask() {
    const task = taskData;
    const embed = getYouTubeEmbed(task.video_url);
    const videoHtml = embed
      ? `<div class="video-wrap"><iframe src="${embed}" allowfullscreen></iframe></div>`
      : `<div class="video-fallback"><div class="vf-icon">🎬</div><div style="font-size:.85rem;color:var(--ink-3);">This video is hosted on another platform.</div>
         <a class="btn-watch" href="${esc(task.video_url)}" target="_blank" rel="noopener">▶ Watch Video</a></div>`;

    const qBlocks = task.questions.map((q, qi) => {
      const opts = q.options.map((opt, oi) =>
        `<div class="option-label" id="opt-${q.id}-${opt.id}" onclick="selectOption(${q.id},${opt.id},this)">
           <span class="opt-letter">${LETTERS[oi]}</span>${esc(opt.option_text)}</div>`
      ).join('');
      return `<div class="question-block" id="qblock-${q.id}">
        <div class="question-header"><span class="q-num">${qi+1}</span><span class="question-text">${esc(q.question)}</span></div>
        <div class="options-grid" id="opts-grid-${q.id}">${opts}</div>
        <div class="feedback-row" id="fb-${q.id}"></div></div>`;
    }).join('');

    document.getElementById('app').innerHTML = `
      <div class="main">
        <div class="hero">
          <div class="hero-eyebrow">📋 Topic / Homework</div>
          <div class="hero-title">${esc(task.title)}</div>
          ${task.description ? `<div class="hero-desc">${esc(task.description)}</div>` : ''}
          <div class="hero-meta">👤 ${esc(task.teacher_name || 'Your teacher')} · ❓ ${task.questions.length} question${task.questions.length !== 1 ? 's' : ''}</div>
        </div>

        <div id="alreadyBanner"></div>

        <div class="card"><div class="card-title">Video</div>${videoHtml}</div>

        <div class="card" id="progressCard">
          <div class="progress-label"><span>Your progress</span><span id="progressText">0 / ${task.questions.length} answered</span></div>
          <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        </div>

        <div class="card">
          <div class="card-title">Comprehension Questions</div>
          ${qBlocks}
          <div class="actions-wrap" id="actionsWrap">
            <div class="warn-msg" id="warnMsg">⚠️ Please answer all questions before submitting.</div>
            <button class="btn-check" id="btnCheck" onclick="submitAnswers()">✅ Submit Answers</button>
            <div class="one-attempt-note">⚠️ You only get one attempt — answers cannot be changed after submitting.</div>
            <div class="score-banner" id="scoreBanner"></div>
          </div>
        </div>
      </div>`;
  }

  function selectOption(questionId, optionId, el) {
    if (alreadyDone) return;
    const grid = document.getElementById('opts-grid-' + questionId);
    grid.querySelectorAll('.option-label').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    selections[questionId] = optionId;
    updateProgress();
  }

  function updateProgress() {
    const total = taskData.questions.length;
    const answered = Object.keys(selections).length;
    const pct = total > 0 ? (answered / total) * 100 : 0;
    const fill = document.getElementById('progressFill');
    const text = document.getElementById('progressText');
    if (fill) fill.style.width = pct + '%';
    if (text) text.textContent = answered + ' / ' + total + ' answered';
  }

  async function submitAnswers() {
    const total = taskData.questions.length;
    const answered = Object.keys(selections).length;
    const warnEl = document.getElementById('warnMsg');

    if (answered < total) {
      warnEl.classList.add('show');
      const unanswered = taskData.questions.find(q => !selections[q.id]);
      if (unanswered) document.getElementById('qblock-' + unanswered.id).scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    warnEl.classList.remove('show');

    if (!confirm('This is your only attempt — once submitted, answers cannot be changed. Submit now?')) return;

    const btn = document.getElementById('btnCheck');
    btn.disabled = true; btn.textContent = '⏳ Submitting…';

    try {
      const answers = {};
      for (const qId in selections) answers[qId] = selections[qId];
      const res  = await fetch(`${API}/api/topics/${taskId}/submit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ answers }),
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.message);
      alreadyDone = true;
      revealResults(data.score, data.total, data.results);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = '✅ Submit Answers';
      alert('Error submitting: ' + e.message);
    }
  }

  function revealResults(score, total, results) {
    taskData.questions.forEach(q => {
      const grid = document.getElementById('opts-grid-' + q.id);
      const fbEl = document.getElementById('fb-' + q.id);
      const result = results[String(q.id)];
      if (!result) return;

      const selectedOptId = selections[q.id];
      const correctOptId  = result.correct_option_id;

      grid.querySelectorAll('.option-label').forEach(label => {
        label.classList.add('locked');
        const optId = parseInt(label.id.split('-').pop());
        if (optId === selectedOptId && result.correct) { label.classList.remove('selected'); label.classList.add('correct'); }
        else if (optId === selectedOptId && !result.correct) { label.classList.remove('selected'); label.classList.add('wrong'); }
        else if (optId === correctOptId && !result.correct) { label.classList.add('correct'); }
      });

      if (result.correct) { fbEl.innerHTML = '✅ Correct!'; fbEl.className = 'feedback-row show correct'; }
      else { fbEl.innerHTML = '❌ Not quite — the correct answer is highlighted.'; fbEl.className = 'feedback-row show wrong'; }
    });

    showScoreBanner(score, total);
    document.getElementById('btnCheck').style.display = 'none';
    document.querySelector('.one-attempt-note').textContent = '✅ Submitted — this task cannot be retaken.';
    document.getElementById('scoreBanner').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function showScoreBanner(score, total) {
    const banner = document.getElementById('scoreBanner');
    let cls, msg;
    if (score === total) { cls = 'great'; msg = '🎉 Perfect score! Outstanding work!'; }
    else if (score >= Math.ceil(total * 0.6)) { cls = 'good'; msg = '👍 Good job!'; }
    else { cls = 'tryagain'; msg = '💪 Keep reviewing the video — you\'ll get it next time.'; }
    banner.innerHTML = '<span class="score-num">' + score + ' / ' + total + '</span>' + msg;
    banner.className = 'score-banner show ' + cls;
  }

  // ── If the student already submitted, render read-only review immediately ──
  function applyReview(submission, review) {
    document.getElementById('alreadyBanner').innerHTML =
      `<div class="already-banner">✅ <div>You already completed this topic on
       ${new Date(submission.submitted_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}
       — scored <strong>${submission.score}/${submission.total}</strong>. Submissions can't be retaken.</div></div>`;

    document.getElementById('progressCard').style.display = 'none';
    document.getElementById('warnMsg').classList.remove('show');
    document.getElementById('btnCheck').style.display = 'none';
    document.querySelector('.one-attempt-note').textContent = '✅ Submitted — this task cannot be retaken.';

    const answersByQ = {};
    (review && review.answers ? review.answers : []).forEach(a => { answersByQ[a.question_id] = a; });

    taskData.questions.forEach(q => {
      const ans = answersByQ[q.id];
      const grid = document.getElementById('opts-grid-' + q.id);
      const fbEl = document.getElementById('fb-' + q.id);
      if (!ans) return;
      grid.querySelectorAll('.option-label').forEach(label => {
        label.classList.add('locked');
        const optId = parseInt(label.id.split('-').pop());
        if (optId === ans.option_id && ans.is_correct) label.classList.add('correct');
        else if (optId === ans.option_id && !ans.is_correct) label.classList.add('wrong');
        else if (optId === ans.correct_option_id && !ans.is_correct) label.classList.add('correct');
      });
      if (ans.is_correct) { fbEl.innerHTML = '✅ Correct!'; fbEl.className = 'feedback-row show correct'; }
      else { fbEl.innerHTML = '❌ Not quite — the correct answer is highlighted.'; fbEl.className = 'feedback-row show wrong'; }
    });

    showScoreBanner(submission.score, submission.total);
  }

  function esc(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
