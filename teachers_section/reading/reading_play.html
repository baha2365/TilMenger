<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading Task — TilMenger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --canvas-blue:#E7F0FA; --canvas-white:#F8FAFC; --canvas-cyan:#E9F7F6; --canvas-violet:#EFEDFB;
      --ink-1:#1D1D1F; --ink-2:#6E6E76; --ink-3:#9C9CA5;
      --glass:rgba(255,255,255,0.58); --glass-strong:rgba(255,255,255,0.80); --glass-soft:rgba(255,255,255,0.38); --glass-border:rgba(255,255,255,0.70);
      --hairline:rgba(28,28,36,0.08); --hairline-2:rgba(28,28,36,0.13);
      --accent:#009C93; --accent-dark:#00776F; --accent-bg:rgba(0,156,147,0.10); --accent-bd:rgba(0,156,147,0.24); --accent-glow:rgba(0,156,147,0.30);
      --success:#2FB350; --success-bg:rgba(47,179,80,0.10); --success-bd:rgba(47,179,80,0.26);
      --error:#FF3B30; --error-bg:rgba(255,59,48,0.09); --error-bd:rgba(255,59,48,0.24);
      --amber:#FF9F0A; --amber-bg:rgba(255,159,10,0.13); --amber-bd:rgba(255,159,10,0.28);
      --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:11px;
      --sh-1:0 1px 1px rgba(28,28,36,0.03),0 6px 18px rgba(28,28,36,0.05);
      --sh-2:0 2px 6px rgba(28,28,36,0.05),0 14px 34px rgba(28,28,36,0.08);
      --sh-float:0 22px 60px rgba(28,28,36,0.16);
      --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
    }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; background: var(--canvas-white); color: var(--ink-1); min-height: 100vh; padding-bottom: 60px; -webkit-font-smoothing: antialiased; overflow-x: hidden; }

    .bg-blobs { position:fixed; inset:0; z-index:-1; overflow:hidden; background:
        radial-gradient(ellipse 60% 50% at 18% 8%,  var(--canvas-blue) 0%, transparent 60%),
        radial-gradient(ellipse 55% 45% at 88% 18%, var(--canvas-violet) 0%, transparent 60%),
        radial-gradient(ellipse 60% 55% at 30% 92%, var(--canvas-cyan) 0%, transparent 62%),
        var(--canvas-white);
    }
    .blob { position:absolute; border-radius:50%; filter:blur(70px); opacity:.5; }
    .blob-1 { width:520px; height:420px; top:-160px; left:-120px; background:radial-gradient(circle,rgba(0,156,147,.26),transparent 70%); }
    .blob-2 { width:460px; height:460px; top:-80px; right:-140px; background:radial-gradient(circle,rgba(10,132,255,.18),transparent 70%); }
    .blob-3 { width:560px; height:460px; bottom:-200px; left:20%; background:radial-gradient(circle,rgba(94,92,230,.16),transparent 70%); }

    .topbar { background: var(--glass-strong); backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); border-bottom: 1px solid var(--hairline); padding: 0 32px; height: 64px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .topbar-logo { display:flex; align-items:center; gap:.55rem; font-family: 'Inter Tight', sans-serif; font-size: 1.05rem; font-weight: 800; color: var(--ink-1); text-decoration: none; letter-spacing:-0.02em; }
    .topbar-logo-mark { width:30px; height:30px; border-radius:9px; flex-shrink:0; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%); display:flex; align-items:center; justify-content:center; color:#fff; font-size:1rem; box-shadow:0 3px 12px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.3); }
    .topbar-logo span { background: linear-gradient(135deg, var(--accent), var(--accent-dark)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .btn-back { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: 999px; font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--ink-2); background: none; border: 1px solid var(--hairline-2); cursor: pointer; transition: all 0.18s var(--ease); }
    .btn-back:hover { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-bg); }

    .hero { position: relative; z-index: 1; padding: 40px 32px 32px; }
    .hero-inner { max-width: 840px; margin: 0 auto; }
    .hero-eyebrow { display:flex; align-items:center; gap:.5rem; font-size: 0.66rem; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
    .hero-eyebrow::before { content:''; width:18px; height:2.5px; border-radius:2px; background: linear-gradient(90deg, var(--accent), var(--accent-dark)); }
    .hero-title { font-family:'Inter Tight',sans-serif; font-size: 1.85rem; font-weight: 800; line-height: 1.15; margin-bottom: 14px; color: var(--ink-1); letter-spacing:-0.03em; }
    .hero-meta { display: flex; gap: 10px; flex-wrap: wrap; }
    .hero-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 700; padding: 6px 13px; border-radius: 999px; }
    .hero-badge.level-beginner     { background: var(--success-bg); color: #1F8A3B; border: 1px solid var(--success-bd); }
    .hero-badge.level-intermediate { background: var(--amber-bg);  color: #B5720A; border: 1px solid var(--amber-bd); }
    .hero-badge.level-advanced     { background: var(--error-bg);   color: #D8291E; border: 1px solid var(--error-bd); }
    .hero-badge.info               { background: var(--glass); border: 1px solid var(--glass-border); color: var(--ink-2); }

    .main { position: relative; z-index: 1; max-width: 840px; margin: 0 auto; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 22px; }
    .card { background: var(--glass); backdrop-filter: blur(22px) saturate(1.5); -webkit-backdrop-filter: blur(22px) saturate(1.5); border: 1px solid var(--glass-border); border-radius: var(--r-lg); box-shadow: var(--sh-2), inset 0 1px 0 rgba(255,255,255,.55); }

    .passage-card { padding: 32px 36px; }
    .section-label { display: inline-flex; align-items: center; gap: 8px; font-size: 0.7rem; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--accent); margin-bottom: 18px; }
    .section-label::before { content: ''; display: block; width: 20px; height: 2.5px; background: linear-gradient(90deg, var(--accent), var(--accent-dark)); border-radius: 2px; }
    .passage-body { font-size: 1.02rem; line-height: 1.9; color: var(--ink-1); }
    .passage-body p { margin-bottom: 14px; }
    .passage-body p:last-child { margin-bottom: 0; }

    .progress-card { padding: 20px 36px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 800; color: var(--ink-3); margin-bottom: 9px; }
    .progress-track { height: 8px; background: var(--hairline-2); border-radius: 99px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-dark)); border-radius: 99px; transition: width 0.4s var(--ease); }

    .questions-card { padding: 28px 36px 32px; }
    .question-block { margin-bottom: 28px; padding-bottom: 28px; border-bottom: 1px dashed var(--hairline-2); }
    .question-block:last-of-type { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
    .question-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .q-num { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 30px; background: linear-gradient(135deg, var(--amber), #FFB74A); color: #fff; border-radius: 50%; font-size: 0.85rem; font-weight: 800; flex-shrink: 0; margin-top: 1px; box-shadow: 0 3px 10px var(--amber-bg); }
    .question-text { font-size: 0.98rem; font-weight: 700; color: var(--ink-1); line-height: 1.4; }

    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .option-label { display: flex; align-items: center; gap: 11px; padding: 12px 14px; border-radius: var(--r-sm); border: 1px solid var(--glass-border); background: rgba(255,255,255,.5); cursor: pointer; transition: all 0.18s var(--ease); font-size: 0.87rem; font-weight: 600; color: var(--ink-2); user-select: none; }
    .option-label:hover:not(.locked) { border-color: var(--accent); background: var(--accent-bg); color: var(--ink-1); }
    .option-label.selected { border-color: var(--accent); background: var(--accent-bg); color: var(--accent-dark); }
    .option-label.correct  { border-color: var(--success-bd);  background: var(--success-bg);   color: #1F8A3B; }
    .option-label.wrong    { border-color: var(--error-bd); background: var(--error-bg);  color: #D8291E; }
    .option-label.locked   { cursor: default; }

    .opt-letter { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 8px; background: var(--accent-bg); color: var(--accent-dark); font-size: 0.78rem; font-weight: 800; flex-shrink: 0; transition: background 0.18s, color 0.18s; }
    .option-label.selected .opt-letter { background: var(--accent); color: #fff; }
    .option-label.correct  .opt-letter { background: var(--success);   color: #fff; }
    .option-label.wrong    .opt-letter { background: var(--error);  color: #fff; }

    .feedback-row { display: none; align-items: center; gap: 7px; margin-top: 10px; font-size: 0.8rem; font-weight: 700; }
    .feedback-row.show { display: flex; }
    .feedback-row.correct { color: #1F8A3B; }
    .feedback-row.wrong   { color: #D8291E; }

    .actions-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 32px; }
    .btn-check { display: inline-flex; align-items: center; gap: 10px; padding: 15px 48px; border-radius: 999px; background: linear-gradient(135deg, var(--accent), var(--accent-dark)); color: #fff; border: none; font-family: 'Inter', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 18px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,.25); transition: transform 0.2s var(--ease), box-shadow 0.2s; }
    .btn-check:hover { transform: translateY(-2px); box-shadow: 0 10px 26px var(--accent-glow); }
    .btn-check:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }
    .btn-retry { display: none; padding: 11px 32px; border-radius: 999px; background: none; border: 1px solid var(--hairline-2); font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 700; color: var(--ink-2); cursor: pointer; transition: all 0.2s var(--ease); }
    .btn-retry:hover { background: var(--ink-1); color: #fff; border-color: var(--ink-1); }
    .btn-retry.show { display: inline-block; }

    .warn-msg { display: none; font-size: 0.85rem; font-weight: 700; color: #D8291E; text-align: center; }
    .warn-msg.show { display: block; }

    .score-banner { display: none; border-radius: var(--r-lg); padding: 24px 28px; text-align: center; font-weight: 800; font-size: 1rem; box-shadow: var(--sh-1); }
    .score-banner.show { display: block; }
    .score-banner.great    { background: var(--success-bg);  color: #1F8A3B; border: 1px solid var(--success-bd); }
    .score-banner.good     { background: var(--amber-bg); color: #8A5A06; border: 1px solid var(--amber-bd); }
    .score-banner.tryagain { background: var(--error-bg); color: #D8291E; border: 1px solid var(--error-bd); }
    .score-num { font-family: 'Inter Tight', sans-serif; font-size: 2.4rem; font-weight: 800; display: block; margin-bottom: 4px; }

    .state-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 14px; text-align: center; padding: 40px 20px; }
    .state-icon { font-size: 2.8rem; }
    .state-title { font-size: 1.2rem; font-weight: 800; color: var(--ink-1); }
    .state-sub   { font-size: 0.9rem; color: var(--ink-3); }

    .sk { display: block; height: 16px; border-radius: 8px; background: linear-gradient(90deg, rgba(255,255,255,.4) 25%, rgba(255,255,255,.7) 50%, rgba(255,255,255,.4) 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; margin-bottom: 10px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    @media (max-width: 600px) {
      .topbar { padding: 0 16px; }
      .hero { padding: 24px 16px 20px; }
      .passage-card, .questions-card, .progress-card { padding: 20px 18px; }
      .options-grid { grid-template-columns: 1fr; }
      .hero-title { font-size: 1.4rem; }
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
  </style>
</head>
<body>

<div class="bg-blobs" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<nav class="topbar">
  <a class="topbar-logo" href="landing_page.html"><div class="topbar-logo-mark">✦</div>Til<span>Menger</span></a>
  <div>
    <button class="btn-back" onclick="history.back()">← Back</button>
  </div>
</nav>

<div id="app"></div>

<script src="../../config.js"></script>

<script>
  const API    = LINGUA.base;
  const params = new URLSearchParams(window.location.search);
  const taskId = params.get('id');
  const token  = localStorage.getItem('token');
  const LETTERS = ['A', 'B', 'C', 'D'];

  let taskData   = null;
  let selections = {};
  let submitted  = false;

  (async function boot() {
    if (!token) { renderState('🔒', 'Login Required', 'Please log in to view this reading task.', true); return; }
    if (!taskId) { renderState('⚠️', 'No Task Found', 'No reading task ID was provided in the URL.'); return; }
    renderLoading();
    try {
      const res  = await fetch(`${API}/api/reading/${taskId}/play`, { headers: { Authorization: 'Bearer ' + token } });
      const data = await res.json();
      if (!data.success) throw new Error(data.message || 'Task not found.');
      taskData = data.task;
      renderTask();
    } catch (e) {
      renderState('📭', 'Task Not Found', e.message || 'This reading task could not be loaded.');
    }
  })();

  function renderLoading() {
    document.getElementById('app').innerHTML =
      '<div style="max-width:840px;margin:32px auto;padding:0 16px">' +
      '<div class="card passage-card"><div class="sk" style="width:40%;height:20px;margin-bottom:18px"></div>' +
      '<div class="sk" style="width:90%"></div><div class="sk" style="width:80%"></div>' +
      '<div class="sk" style="width:85%"></div><div class="sk" style="width:70%"></div></div></div>';
  }

  function renderState(icon, title, sub, showLogin) {
    document.getElementById('app').innerHTML =
      '<div class="state-screen"><div class="state-icon">' + icon + '</div>' +
      '<div class="state-title">' + title + '</div>' +
      '<div class="state-sub">' + sub + '</div>' +
      (showLogin ? '<button onclick="window.location.href=\'login.html\'" style="margin-top:12px;padding:12px 32px;background:var(--accent);color:#fff;border:none;border-radius:999px;font-family:Inter,sans-serif;font-size:1rem;font-weight:700;cursor:pointer;">Go to Login</button>' : '') +
      '</div>';
  }

  function renderTask() {
    var task = taskData;
    var levelMap = { beginner: '🟢 Beginner', intermediate: '🟡 Intermediate', advanced: '🔴 Advanced' };
    var paragraphs = task.passage.split(/\n+/).filter(function(p){ return p.trim(); }).map(function(p){ return '<p>' + esc(p.trim()) + '</p>'; }).join('');

    var qBlocks = task.questions.map(function(q, qi) {
      var opts = q.options.map(function(opt, oi) {
        return '<div class="option-label" id="opt-' + q.id + '-' + opt.id + '" onclick="selectOption(' + q.id + ',' + opt.id + ',this)">' +
               '<span class="opt-letter">' + LETTERS[oi] + '</span>' + esc(opt.option_text) + '</div>';
      }).join('');
      return '<div class="question-block" id="qblock-' + q.id + '">' +
             '<div class="question-header"><span class="q-num">' + (qi+1) + '</span>' +
             '<span class="question-text">' + esc(q.question) + '</span></div>' +
             '<div class="options-grid" id="opts-grid-' + q.id + '">' + opts + '</div>' +
             '<div class="feedback-row" id="fb-' + q.id + '"></div></div>';
    }).join('');

    document.getElementById('app').innerHTML =
      '<div class="hero"><div class="hero-inner">' +
      '<div class="hero-eyebrow">Reading Task</div>' +
      '<div class="hero-title">' + esc(task.title) + '</div>' +
      '<div class="hero-meta">' +
      '<span class="hero-badge level-' + task.level + '">' + (levelMap[task.level] || task.level) + '</span>' +
      '<span class="hero-badge info">👤 ' + esc(task.teacher_name || 'Your teacher') + '</span>' +
      '<span class="hero-badge info">❓ ' + task.questions.length + ' question' + (task.questions.length !== 1 ? 's' : '') + '</span>' +
      '</div></div></div>' +
      '<div class="main">' +
      '<div class="card passage-card"><div class="section-label">Reading Passage</div><div class="passage-body">' + paragraphs + '</div></div>' +
      '<div class="card progress-card"><div class="progress-label"><span>Your progress</span><span id="progressText">0 / ' + task.questions.length + ' answered</span></div>' +
      '<div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div></div>' +
      '<div class="card questions-card"><div class="section-label">Comprehension Questions</div>' + qBlocks +
      '<div class="actions-wrap">' +
      '<div class="warn-msg" id="warnMsg">⚠️ Please answer all questions before checking.</div>' +
      '<button class="btn-check" id="btnCheck" onclick="checkAnswers()">✅ Check My Answers</button>' +
      '<div class="score-banner" id="scoreBanner"></div>' +
      '<button class="btn-retry" id="btnRetry" onclick="retryQuiz()">🔄 Try Again</button>' +
      '</div></div></div>';
  }

  function selectOption(questionId, optionId, el) {
    if (submitted) return;
    var grid = document.getElementById('opts-grid-' + questionId);
    grid.querySelectorAll('.option-label').forEach(function(o){ o.classList.remove('selected'); });
    el.classList.add('selected');
    selections[questionId] = optionId;
    updateProgress();
  }

  function updateProgress() {
    var total    = taskData.questions.length;
    var answered = Object.keys(selections).length;
    var pct      = total > 0 ? (answered / total) * 100 : 0;
    var fill = document.getElementById('progressFill');
    var text = document.getElementById('progressText');
    if (fill) fill.style.width = pct + '%';
    if (text) text.textContent = answered + ' / ' + total + ' answered';
  }

  async function checkAnswers() {
    var total    = taskData.questions.length;
    var answered = Object.keys(selections).length;
    var warnEl   = document.getElementById('warnMsg');

    if (answered < total) {
      warnEl.classList.add('show');
      var unanswered = taskData.questions.find(function(q){ return !selections[q.id]; });
      if (unanswered) document.getElementById('qblock-' + unanswered.id).scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    warnEl.classList.remove('show');

    var btn = document.getElementById('btnCheck');
    btn.disabled = true;
    btn.textContent = '⏳ Checking…';

    try {
      var answers = {};
      for (var qId in selections) answers[qId] = selections[qId];
      var res  = await fetch(API + '/api/reading/' + taskId + '/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ answers: answers })
      });
      var data = await res.json();
      if (!data.success) throw new Error(data.message);
      submitted = true;
      revealResults(data);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = '✅ Check My Answers';
      alert('Error checking answers: ' + e.message);
    }
  }

  function revealResults(data) {
    var score   = data.score;
    var total   = data.total;
    var results = data.results;

    taskData.questions.forEach(function(q) {
      var grid   = document.getElementById('opts-grid-' + q.id);
      var fbEl   = document.getElementById('fb-' + q.id);
      var result = results[String(q.id)];
      if (!result) return;

      var selectedOptId = selections[q.id];
      var correctOptId  = result.correct_option_id;

      grid.querySelectorAll('.option-label').forEach(function(label) {
        label.classList.add('locked');
        var parts = label.id.split('-');
        var optId = parseInt(parts[parts.length - 1]);
        if (optId === selectedOptId && result.correct) {
          label.classList.remove('selected'); label.classList.add('correct');
        } else if (optId === selectedOptId && !result.correct) {
          label.classList.remove('selected'); label.classList.add('wrong');
        } else if (optId === correctOptId && !result.correct) {
          label.classList.add('correct');
        }
      });

      if (result.correct) {
        fbEl.innerHTML = '✅ Correct!';
        fbEl.className = 'feedback-row show correct';
      } else {
        fbEl.innerHTML = '❌ Not quite — the correct answer is highlighted in green.';
        fbEl.className = 'feedback-row show wrong';
      }
    });

    var banner = document.getElementById('scoreBanner');
    var retry  = document.getElementById('btnRetry');
    var cls, msg;
    if (score === total) {
      cls = 'great';    msg = '🎉 Perfect score! Outstanding work!';
    } else if (score >= Math.ceil(total * 0.6)) {
      cls = 'good';     msg = '👍 Good job! Keep reading and you\'ll ace it!';
    } else {
      cls = 'tryagain'; msg = '💪 Keep going! Read the passage carefully and try again.';
    }
    banner.innerHTML = '<span class="score-num">' + score + ' / ' + total + '</span>' + msg;
    banner.className = 'score-banner show ' + cls;
    retry.classList.add('show');
    banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function retryQuiz() {
    selections = {};
    submitted  = false;
    document.querySelectorAll('.option-label').forEach(function(el) { el.classList.remove('selected','correct','wrong','locked'); });
    document.querySelectorAll('.feedback-row').forEach(function(el) { el.className = 'feedback-row'; el.innerHTML = ''; });
    document.getElementById('scoreBanner').className = 'score-banner';
    document.getElementById('btnRetry').classList.remove('show');
    document.getElementById('btnCheck').disabled = false;
    document.getElementById('btnCheck').textContent = '✅ Check My Answers';
    document.getElementById('warnMsg').classList.remove('show');
    updateProgress();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
